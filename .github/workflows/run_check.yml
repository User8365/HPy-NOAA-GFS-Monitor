name: GFS Monitor Service

on:
  workflow_dispatch: # Permet de lancer le bot manuellement pour tester

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    # Important : donne la permission d'écrire dans le dépôt pour status.json
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐍 Installation de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 Installation des dépendances
        run: |
          pip install -r requirements.txt

      - name: 🛰️ Exécution du script de détection
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bot_noaa.py

      - name: 💾 Sauvegarde de l'état et des logs
        run: |
          git config --global user.name 'GFS-Bot-Automator'
          git config --global user.email 'bot@github.com'
          git add status.json activity.log
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update NOAA status and logs [skip ci]"
            git push
          else
            echo "Aucun changement à sauvegarder"
          fi

